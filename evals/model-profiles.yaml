# Eval model profiles (EV-C1 §3). Canonical copy: HaikeiLabs/agentware.
# Repos that run evals copy this file to evals/model-profiles.yaml (same shape).
#
# base_url_env names the environment variable holding the OpenAI-compatible
# base URL (including /v1). Never commit endpoint URLs, tailnet IPs or
# hostnames here -- set the variable locally, or from CI secrets / the
# Tailscale-operator egress Service names.
#
# concurrency is the endpoint's slot count; the runner caps --jobs to it.
# Use --jobs 1 while the endpoint is shared with other workers.
# temperature (default 0), and top_p, top_k and seed when set, go with every
# model request from both runners, so a rerun of an unchanged suite asks the
# model the same way; repeats then measure the variance that is left.
# thinking: true or false switches reasoning through the chat template on
# every request. Owner decision 2026-10-13: thinking on for every model (with
# it off, DeepSeek, the former gate model, fell to 44-72% on several skills); Qwen samples as its docs
# recommend for thinking mode, because greedy sampling makes it loop.
# opencode_model is read by the skills runner only; the qwen entry's opencode
# provider is a local name, so it lives in each developer's opencode config.
profiles:
  glm-5.3-flash:
    backend: vllm
    model: nvidia/GLM-5.3-Flash-FP4-Local
    # Historical name: EVAL_DEEPSEEK_BASE_URL now points at the GLM server
    # (DeepSeek V4 Flash was removed). Renaming the variable is a runner-env
    # change outside this repository.
    base_url_env: EVAL_DEEPSEEK_BASE_URL
    concurrency: 2
    temperature: 0
    seed: 42
    thinking: true
    opencode_model: eval/nvidia/GLM-5.3-Flash-FP4-Local
  qwen3.8-27b:
    backend: llamacpp
    model: qwen3.8-27b
    base_url_env: EVAL_QWEN_BASE_URL
    # One GPU serves Qwen to up to 4 CI runners and the workers' local runs,
    # so each job sends one request at a time (owner decision 2026-10-12).
    concurrency: 1
    temperature: 0.6
    top_p: 0.95
    top_k: 20
    seed: 42
    thinking: true
