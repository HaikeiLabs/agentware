[package]
name = "haikeilabs-agentware"
version = "0.16.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Agentware for Rust: Kei runtime socket client, tool-call authorization, tool sync and agent middleware"
repository = "https://github.com/HaikeiLabs/agentware"
homepage = "https://docs.haikeilabs.com/agentware/build/overview"
readme = "../README.md"
keywords = ["agents", "ai-agents", "guardrails", "llm", "kei"]
categories = ["api-bindings", "development-tools"]

[dependencies]
regex = "1"
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
ureq = { version = "3", features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[lints]
workspace = true
