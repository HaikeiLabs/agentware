[build-system]
# setuptools 77 implements PEP 639 (SPDX `license` + `license-files`).
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "haikeilabs-agentware"
# The wheel's metadata, and so haikeilabs.agentware.__version__, come from
# here. The value is the PEP 440 spelling of the repository VERSION, shared with
# the npm package and the Go module; change it with
# `python3 scripts/release/version.py set X.Y.Z`, never by hand. A release tags
# agentware-py-v<version>.
version = "0.13.0"
description = "Policy enforcement and audit middleware for LLM agent tool calls"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
    {name = "HaikeiLabs"},
]
requires-python = ">=3.10"
keywords = ["llm", "agents", "tool-calling", "mcp", "policy", "audit", "middleware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
inference = [
    "pgmpy>=0.1.26",
]
evals = [
    "pyyaml>=6.0",
]
dev = [
    "pyyaml>=6.0",
    "types-PyYAML>=6.0",
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-asyncio>=0.21",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.urls]
Homepage = "https://github.com/HaikeiLabs/agentware"
Documentation = "https://github.com/HaikeiLabs/agentware/tree/main/docs/python"
Repository = "https://github.com/HaikeiLabs/agentware"
Issues = "https://github.com/HaikeiLabs/agentware/issues"
Changelog = "https://github.com/HaikeiLabs/agentware/blob/main/python/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]
# haikeilabs/ is a PEP 420 implicit namespace package (no __init__.py), so other
# haikeilabs.* distributions can install beside this one.
namespaces = true
# The SDK and its deprecated pedro_agentware alias. src/evals is the repo's eval
# runner (run with PYTHONPATH=src) and must not land on PyPI as a top-level
# "evals" package.
include = ["haikeilabs.agentware*", "pedro_agentware*"]
exclude = ["*.__pycache__"]

[tool.setuptools.package-data]
"haikeilabs.agentware" = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
# src/haikeilabs is a namespace package: module names are relative to src/.
mypy_path = "src"
explicit_package_bases = true
strict = true
ignore_missing_imports = true
warn_return_any = false
exclude = ["tests", "adapters"]
