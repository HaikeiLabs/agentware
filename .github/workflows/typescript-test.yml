name: TypeScript Test

on:
  push:
    branches: [main]
    paths:
      - 'typescript/**'
      - '.github/workflows/typescript-test.yml'
      - 'testing/contracts/runtime-link/**'
      - 'fixtures/**'
      - 'examples/typescript/minimal-harness/**'
  pull_request:
    branches: [main]
    paths:
      - 'typescript/**'
      - '.github/workflows/typescript-test.yml'
      - 'testing/contracts/runtime-link/**'
      - 'fixtures/**'
      - 'examples/typescript/minimal-harness/**'

jobs:
  typescript-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18'
      - name: Install dependencies
        run: |
          cd typescript
          npm ci
      - name: Run TypeScript lint
        run: |
          cd typescript
          npm run lint
      - name: Run TypeScript build
        run: |
          cd typescript
          npm run build
      - name: Install minimal harness example dependency
        run: |
          cd examples/typescript/minimal-harness
          npm ci
      - name: Typecheck TypeScript minimal harness
        run: |
          cd examples/typescript/minimal-harness
          npm run typecheck
      - name: Run TypeScript tests
        run: |
          cd typescript
          npm test
      - name: Check npm package contents and consumer import
        run: |
          cd typescript
          npm run check:package
      - name: Run TypeScript minimal harness offline
        run: |
          cd examples/typescript/minimal-harness
          npm start -- --fake
