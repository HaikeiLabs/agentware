name: Fuzz

# T6 of docs/testing.md: the native Go fuzz targets for the parsers. PRs that
# touch a fuzzed package or the fixtures (the seed corpora) fuzz each target
# for 30s; the nightly schedule and workflow_dispatch fuzz each for 10m. A
# failing input is uploaded as an artifact and the job summary says how to
# replay it locally.
#
# The nightly and workflow_dispatch runs also run the TypeScript parser
# property tests (fast-check) and the Python parser property tests
# (Hypothesis) at a high run count. PRs already run them at the default
# ~200-example profile in typescript-test.yml and python-test.yml, so those
# jobs never run on PRs.
#
# Public repo, GitHub-hosted runners only: fuzzing needs no secrets or live
# model, so the long run stays on hosted runners too. Never pull_request_target.

on:
  pull_request:
    branches: [main]
    paths:
      - 'go/toolformat/**'
      - 'go/toolspec/**'
      - 'go/reasoning/**'
      - 'fixtures/**'
      - '.github/workflows/fuzz.yml'
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      fuzztime:
        description: 'Fuzz time per target (Go duration, e.g. 10m, 1h)'
        required: false
        default: '10m'

permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fuzz:
    name: Fuzz (${{ matrix.target }})
    runs-on: ubuntu-latest
    # Covers a workflow_dispatch fuzztime up to ~5h; the hosted job limit is 6h.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 15 || 330 }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: FuzzParseToolCalls
            package: toolformat
          - target: FuzzParseManifestV3
            package: toolspec
          - target: FuzzAdapter
            package: reasoning
    env:
      FUZZTIME: ${{ github.event_name == 'pull_request' && '30s' || inputs.fuzztime || '10m' }}
      CORPUS: go/${{ matrix.package }}/testdata/fuzz/${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum

      - name: Fuzz ${{ matrix.target }} for ${{ env.FUZZTIME }}
        working-directory: go
        run: go test -run='^$' -fuzz='^${{ matrix.target }}$' -fuzztime="$FUZZTIME" "./${{ matrix.package }}/"

      # go test writes a failing input to testdata/fuzz/<Target>/. Keep only
      # the new files, not the committed regression seeds.
      - name: Collect new crashers
        id: crashers
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/crashers"
          git ls-files --others --exclude-standard -- "$CORPUS" > "$RUNNER_TEMP/new-files"
          while read -r file; do
            cp "$file" "$RUNNER_TEMP/crashers/"
          done < "$RUNNER_TEMP/new-files"
          {
            echo "### ${{ matrix.target }} failed"
            echo
            if [ -s "$RUNNER_TEMP/new-files" ]; then
              echo "Download the \`fuzz-crashers-${{ matrix.target }}\` artifact into \`$CORPUS/\` and replay each input:"
              echo
              echo '```sh'
              echo "cd go"
              while read -r file; do
                echo "go test -run='${{ matrix.target }}/$(basename "$file")' ./${{ matrix.package }}/"
              done < "$RUNNER_TEMP/new-files"
              echo '```'
              echo
              echo "Fix the parser, then commit the input under \`$CORPUS/\` as a regression seed."
            else
              echo "No new input was written to \`$CORPUS/\`; see the job log (build error or timeout)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$RUNNER_TEMP/new-files" ]; then echo "found=true" >> "$GITHUB_OUTPUT"; fi

      - if: failure() && steps.crashers.outputs.found == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashers-${{ matrix.target }}
          path: ${{ runner.temp }}/crashers/
          if-no-files-found: error
          retention-days: 30

  typescript-properties:
    name: Property tests (TypeScript)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FC_NUM_RUNS: '20000'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.18'
          cache: npm
          cache-dependency-path: typescript/package-lock.json

      - name: Install dependencies
        working-directory: typescript
        run: npm ci

      # fast-check puts the seed, path and shrunk counterexample in the failure
      # message, which jest prints; the log is kept to copy them into the summary.
      - name: Run parser property tests (${{ env.FC_NUM_RUNS }} runs)
        working-directory: typescript
        run: |
          set -o pipefail
          npm test -- --runInBand tests/parser-fuzz.test.ts 2>&1 | tee "$RUNNER_TEMP/parser-fuzz.log"

      - name: Report the failing seed
        if: failure()
        run: |
          {
            echo "### TypeScript property tests failed"
            echo
            if grep -qE '^ *\{ seed: -?[0-9]+, path: ' "$RUNNER_TEMP/parser-fuzz.log"; then
              echo "fast-check reported (failing property, seed/path, counterexample):"
              echo
              echo '```'
              grep -E '^ *● |^ *\{ seed: -?[0-9]+, path: |^ *Counterexample: ' "$RUNNER_TEMP/parser-fuzz.log"
              echo '```'
              echo
              echo "Replay from \`typescript/\` with the seed and path above:"
              echo
              echo '```sh'
              echo "FC_SEED=<seed> FC_PATH='<path>' npm test -- --runInBand tests/parser-fuzz.test.ts -t '<property name>'"
              echo '```'
            else
              echo "No fast-check seed in the log; see the job log (install error or timeout)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # The Python twin of typescript-properties: the Hypothesis property tests
  # (python/tests/parser_fuzz_test.py) at the nightly run count. PRs already
  # run them at the default profile in python-test.yml, so this job never
  # runs on PRs.
  python-properties:
    name: Property tests (Python)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      HYPOTHESIS_PROFILE: nightly
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.11'
          enable-cache: true
          cache-dependency-glob: python/pyproject.toml

      # Hypothesis prints the falsifying example and a @reproduce_failure
      # blob, which pytest shows in the log; the log is kept to copy them
      # into the summary.
      - name: Run parser property tests (HYPOTHESIS_PROFILE=nightly)
        working-directory: python
        run: |
          set -o pipefail
          uv run --extra dev pytest -q tests/parser_fuzz_test.py 2>&1 | tee "$RUNNER_TEMP/parser-fuzz.log"

      - name: Report the failing example
        if: failure()
        run: |
          {
            echo "### Python property tests failed"
            echo
            if grep -q 'Falsifying example' "$RUNNER_TEMP/parser-fuzz.log"; then
              echo "Hypothesis reported a falsifying example; replay it with the \`@reproduce_failure\` blob it suggests:"
              echo
              echo '```'
              grep -B1 -A25 'Falsifying example' "$RUNNER_TEMP/parser-fuzz.log" | head -60
              echo '```'
            else
              echo "No falsifying example in the log; see the job log (install error or timeout)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
