# Agent and skill eval gate. Template: HaikeiLabs/kei docs/agent-evals/agent-evals.template.yaml
# Runbook: HaikeiLabs/kei docs/agent-evals-gate.md. Contract: EV-C1.
#
# Copy this file to .github/workflows/agent-evals.yaml and change ONLY the two
# EDIT-BEGIN/EDIT-END blocks. A repository with both agent and skill suites
# keeps two copies with different `name:` values and file names.
#
# On a same-repository pull request it runs, once per model profile and once
# per case (EVAL_REPEATS 1), the eval suites the pull request changes (all of
# them when this workflow or an EVAL_GLOBAL_PATHS file changes; none, and a
# green "no eval-relevant changes" comment, when no changed file maps to a
# suite). It runs them on the self-hosted kei-agent-evals runners, which reach the model
# servers through Tailscale egress Services. It posts one sticky
# <!-- agent-evals --> comment (suite x model table) and fails when any suite
# is below EVAL_THRESHOLD or a model server does not answer ("models
# unreachable", never scored).
#
# Nightly (09:00 UTC) and on demand (workflow_dispatch) it runs every suite
# three times per case on the default branch; that averaged sweep is the
# record. A failing sweep opens or updates one "Nightly agent evals below 95%"
# issue with the report, and a passing one closes it.
#
# While a pull request carries the evals:tuning label, nothing runs and
# agent-evals-report fails ("evals:tuning is set: remove the label to run the
# gate before merge"). Removing the label runs the gate.
#
# Closing or merging a pull request cancels its eval run, so a stale branch
# never holds the kei-agent-evals runners. A pull request eval job stops after
# 30 minutes and the nightly one after 110; an eval job that times out fails
# agent-evals-report, never a silent pass.
#
# Every pull request gets the agent-evals-report check, so it can be a
# required status check. The trigger has no path filter: a pull request that
# changes no suite gets a green "no eval-relevant changes" report. Keep the
# paths EDIT block empty in a repository that requires the check.
#
# Security (these runners are self-hosted and callers include public repos):
#   - pull_request, schedule and workflow_dispatch only. Never
#     pull_request_target: it would run the pull request's code with a write
#     token. schedule and workflow_dispatch run this repository's own code.
#   - scope and eval are skipped unless the pull request comes from this
#     repository, so fork pull requests never reach the self-hosted runners.
#     On a fork pull request the report job runs on a GitHub-hosted runner,
#     runs no pull request code, posts no comment and passes as "not evaluated".
#   - least privilege: contents: read; pull-requests: write only on the job that
#     comments; issues: write only on the nightly job, which never runs on a
#     pull request.
#   - the grader is pinned by commit SHA, so a pull request can change its
#     suites but not the code that grades them.
# Also required: the organization's "require approval for fork pull request
# workflows" setting, and the "Agent evals" runner group with this repository
# selected (and "Allow public repositories" on for a public repository).
name: Agent evals

on:
  pull_request:
    # No path filter by default, so agent-evals-report can be a required status
    # check (a required check must run on every pull request). A repository that
    # does not require it may add a filter in this block, keeping this file:
    #   paths: ["evals/**", ".github/workflows/agent-evals.yaml"]
    # EDIT-BEGIN paths
    # This repository keeps a filter: its check is not required.
    paths:
      # The repository's own EV-C1 suites and model profiles.
      - "evals/**"
      # This workflow: a change to it re-runs every suite.
      - ".github/workflows/agent-evals.yaml"
    # EDIT-END paths
    # The default types, plus label changes for evals:tuning, plus closed:
    # closing or merging the pull request starts a run that skips every job
    # and, through the concurrency group, cancels the eval run in flight.
    types: [opened, synchronize, reopened, labeled, unlabeled, closed]
  # The nightly sweep of every suite on the default branch.
  schedule:
    - cron: "0 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A new push, label change, close or merge cancels the older run, which frees
# the kei-agent-evals runners and the shared model servers. The nightly sweep
# and a dispatch share the branch's group.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  # EDIT-BEGIN settings
  # agent: EV-C1 agent suites, graded by HaikeiLabs/agentware python/src/evals.
  EVAL_KIND: agent
  # Space-separated globs relative to the repository root (** works).
  # agentware.beta-tools: the beta governed-tool suite.
  EVAL_SUITES: "evals/suites/*.json"
  # evals/model-profiles.yaml is the canonical profile file (EV-C1 §3), and
  # the probe reads it from this repository first: a change re-runs every suite.
  # The grader below is pinned, so a pull request that changes python/src/evals
  # is still graded by the pinned runner, not by its own change.
  EVAL_GLOBAL_PATHS: "evals/model-profiles.yaml"
  # HaikeiLabs/agentware at the HAI-470 runner (agentware#177): the profile's
  # temperature 0 and seed on every request, --repeats, and a suite score of
  # passed runs / total runs. Move to its merge commit once it lands.
  EVAL_RUNNER_REF: "11abdb82d048c14f9196c9fc5598f949d2b79a60"
  # EDIT-END settings
  EVAL_THRESHOLD: "0.95"
  # EV-C1 §3 profile names; each needs its base_url_env set on the runner.
  EVAL_PROFILES: '["deepseek-v4-flash", "qwen3.8-27b"]'
  # Runs per case (HAI-521, owner decision 2026-10-13): 1 on a pull request,
  # so the gate stays fast; 3 on the nightly sweep, the averaged record. A
  # suite scores passed runs / total runs, the average over repeats, and
  # EVAL_THRESHOLD applies to that. The model profiles fix sampling and seed.
  EVAL_REPEATS: ${{ github.event_name == 'pull_request' && '1' || '3' }}
  # Runs (cases x repeats) per eval job. scope splits the selected suites into
  # shards of about this many runs, one eval job per profile per shard, so each
  # job fits the timeout on model hosts shared with other runs (measured ~0.3
  # to 1 run/min on qwen3.8-27b at 2 slots, ~0.6 to 1.5/min on
  # deepseek-v4-flash at 4). A suite with more runs than this is split by
  # repeats across shards.
  EVAL_SHARD_RUNS: "30"

jobs:
  # Picks the suites to run from the pull request's diff: mode=changed runs the
  # suites that hold a changed file, mode=all runs EVAL_SUITES (and is the
  # nightly sweep), mode=none runs nothing and the report passes with "no
  # eval-relevant changes", mode=tuning runs nothing and the report fails
  # until the evals:tuning label is removed.
  scope:
    if: >-
      github.event.action != 'closed' &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    # scope and report run GitHub-hosted, public or private: they need no AWS,
    # tailnet or secrets, and must not queue behind eval sweeps on
    # kei-agent-evals. Never a privileged self-hosted runner: report parses
    # artifacts that pull request code produced.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.select.outputs.mode }}
      suites: ${{ steps.select.outputs.suites }}
      reason: ${{ steps.select.outputs.reason }}
      shards: ${{ steps.select.outputs.shards }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      # Full history for the merge base; no pull request code runs here.
      - uses: actions/checkout@v4
        with:
          path: _eval/repo
          fetch-depth: 0
          persist-credentials: false

      - name: Select the suites
        id: select
        uses: actions/github-script@v7
        env:
          REPO_DIR: _eval/repo
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_NAME: ${{ github.event_name }}
          TUNING: ${{ contains(github.event.pull_request.labels.*.name, 'evals:tuning') }}
        with:
          script: |
            // BEGIN agent-evals scope (tested by HaikeiLabs/kei scripts/agent-evals/test-report.mjs)
            const fs = require('fs');
            const path = require('path');
            const { execFileSync } = require('child_process');

            const kind = process.env.EVAL_KIND;
            const repo = process.env.REPO_DIR;
            const words = (s) => String(s ?? '').split(/\s+/).filter(Boolean);
            // ** spans directories, * and ? stay within one path segment.
            const wild = new Map([['**/', '(?:.*/)?'], ['**', '.*'], ['*', '[^/]*'], ['?', '[^/]']]);
            const globRe = (g) => new RegExp(`^${g.split(/(\*\*\/|\*\*|\*|\?)/)
              .map((t) => wild.get(t) ?? t.replace(/[.+^${}()|[\]\\]/g, '\\$&')).join('')}$`);
            const suiteGlobs = words(process.env.EVAL_SUITES).map((g) => globRe(g.replace(/\/+$/, '')));
            const globalGlobs = words(process.env.EVAL_GLOBAL_PATHS).map(globRe);
            // owner/repo/.github/workflows/<file>@<ref>: this workflow grades every suite.
            const workflowFile = String(process.env.GITHUB_WORKFLOW_REF ?? '')
              .replace(/^[^/]+\/[^/]+\//, '').replace(/@.*$/, '');
            const event = process.env.EVENT_NAME;
            const nightly = event === 'schedule' || event === 'workflow_dispatch';

            // evals:tuning: nothing runs, and the report fails until the label
            // is removed, which re-runs this workflow (unlabeled).
            if (!nightly && process.env.TUNING === 'true') {
              core.setOutput('mode', 'tuning');
              core.setOutput('suites', '');
              core.setOutput('reason', 'evals:tuning is set');
              core.setOutput('shards', '0');
              core.setOutput('matrix', JSON.stringify({ include: [] }));
              core.info('mode=tuning: the evals:tuning label is set, so no suite runs');
              return;
            }

            // Three-dot: what the pull request changed since its merge base.
            // --no-renames lists a rename as its old and its new path, so moving
            // a file out of a suite selects that suite too. A nightly sweep has
            // no pull request and runs every suite.
            const changed = nightly ? [] : execFileSync('git', ['diff', '--name-only', '--no-renames', '-z',
              `${process.env.BASE_SHA}...${process.env.HEAD_SHA}`], { cwd: repo, encoding: 'utf8' })
              .split('\0').filter(Boolean);

            // The shortest path that is the file or one of its directories and
            // matches a suite glob.
            const suiteOf = (file) => {
              const parts = file.split('/');
              for (let i = 1; i <= parts.length; i++) {
                const p = parts.slice(0, i).join('/');
                if (suiteGlobs.some((re) => re.test(p))) return p;
              }
              return null;
            };
            // A suite that the pull request deleted, or a skill directory without
            // evals, is not run.
            const isSuite = (p) => kind === 'skill'
              ? fs.existsSync(path.join(repo, p, 'evals/evals.json'))
              : fs.existsSync(path.join(repo, p));

            // Every path in the repository (directories too), for mode=all.
            const allPaths = (dir = '') => fs.readdirSync(path.join(repo, dir), { withFileTypes: true })
              .filter((e) => e.name !== '.git' && e.name !== 'node_modules')
              .flatMap((e) => {
                const p = dir ? `${dir}/${e.name}` : e.name;
                return e.isDirectory() ? [p, ...allPaths(p)] : [p];
              });

            let mode;
            let selected;
            let reason;
            const global = changed.find((f) => f === workflowFile || globalGlobs.some((re) => re.test(f)));
            if (nightly || global) {
              mode = 'all';
              reason = nightly ? `nightly sweep (${event})` : `${global} changed`;
              selected = [...new Set(allPaths().map(suiteOf).filter(Boolean))].filter(isSuite).sort();
            } else {
              selected = [...new Set(changed.map(suiteOf).filter(Boolean))].filter(isSuite).sort();
              mode = selected.length ? 'changed' : 'none';
              reason = selected.length ? `${selected.length} changed suite(s)` : 'no changed file is in an eval suite';
            }
            const bad = selected.find((p) => !/^[A-Za-z0-9._\/-]+$/.test(p));
            if (bad) {
              core.setFailed(`suite path ${JSON.stringify(bad)} has characters other than A-Za-z0-9._/-`);
              return;
            }
            if (mode === 'all' && !selected.length) {
              core.setFailed(`no suites match '${process.env.EVAL_SUITES}'`);
              return;
            }

            // Shards. A unit is one suite at some number of repeats, weighed in
            // runs (cases x repeats). A suite with more than EVAL_SHARD_RUNS runs
            // is split by repeats into several units, so no job runs all of a
            // big suite's repeats. Units with the same repeats are packed,
            // largest first, into the lightest of N shards of about
            // EVAL_SHARD_RUNS runs; a shard never holds the same suite twice.
            const cases = (file) => {
              try {
                const doc = JSON.parse(fs.readFileSync(path.join(repo, file), 'utf8'));
                const n = kind === 'skill' ? doc?.evals?.length : doc?.cases?.length;
                return Number.isInteger(n) && n > 0 ? n : 1;
              } catch {
                return 1;
              }
            };
            const caseCount = (p) => kind === 'skill'
              ? cases(`${p}/evals/evals.json`)
              : fs.statSync(path.join(repo, p)).isDirectory()
                ? Math.max(1, allPaths(p).filter((f) => f.endsWith('.json')).reduce((n, f) => n + cases(f), 0))
                : cases(p);
            const repeats = Math.max(1, Math.floor(Number(process.env.EVAL_REPEATS)) || 1);
            const perShard = Math.max(1, Number(process.env.EVAL_SHARD_RUNS) || 30);
            const groups = new Map();
            for (const p of selected) {
              const n = caseCount(p);
              const chunk = Math.max(1, Math.min(repeats, Math.floor(perShard / n)));
              for (let left = repeats; left > 0; left -= chunk) {
                const r = Math.min(chunk, left);
                if (!groups.has(r)) groups.set(r, []);
                groups.get(r).push({ suite: p, repeats: r, runs: n * r });
              }
            }
            const bins = [];
            for (const [r, units] of [...groups].sort((a, b) => b[0] - a[0])) {
              const runs = units.reduce((n, u) => n + u.runs, 0);
              const group = Array.from({ length: Math.max(1, Math.min(units.length, Math.ceil(runs / perShard))) },
                () => ({ repeats: r, load: 0, suites: [] }));
              for (const u of units.sort((a, b) => b.runs - a.runs || a.suite.localeCompare(b.suite))) {
                const open = group.filter((b) => !b.suites.includes(u.suite));
                let bin = open.length ? open.reduce((min, b) => (b.load < min.load ? b : min)) : null;
                if (!bin) group.push(bin = { repeats: r, load: 0, suites: [] });
                bin.load += u.runs;
                bin.suites.push(u.suite);
              }
              bins.push(...group);
            }
            const shards = bins.length;
            const total = bins.reduce((n, b) => n + b.load, 0);
            // Shard-major, so the runners alternate between the model hosts.
            const profiles = JSON.parse(process.env.EVAL_PROFILES);
            const include = bins.flatMap((b, i) => profiles.map((profile) => ({
              profile, shard: i + 1, shards, repeats: b.repeats, suites: b.suites.sort().join(' ') })));

            const suites = selected.join(' ');
            core.setOutput('mode', mode);
            core.setOutput('suites', suites);
            core.setOutput('reason', reason);
            core.setOutput('shards', String(shards));
            core.setOutput('matrix', JSON.stringify({ include }));
            core.info(`${changed.length} changed file(s); mode=${mode} (${reason}); ${total} run(s) at ${repeats} repeat(s) `
              + `in ${shards} shard(s): ${bins.map((b, i) => `${i + 1}=${b.load}x${b.repeats}r`).join(' ')}; suites: ${suites || '(none)'}`);
            // END agent-evals scope

  eval:
    name: eval (${{ matrix.profile }} ${{ matrix.shard }}/${{ matrix.shards }})
    needs: scope
    if: >-
      github.event.action != 'closed' &&
      (needs.scope.outputs.mode == 'changed' || needs.scope.outputs.mode == 'all') &&
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' ||
        github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: kei-agent-evals
    # A pull request runs one repeat of the suites it changes, split into
    # shards of about EVAL_SHARD_RUNS runs, so 30 minutes is enough and a stuck
    # job frees its runner soon. The nightly sweep (three repeats of every
    # suite) gets 110, below the runner pod's activeDeadlineSeconds (2h). A
    # job that times out uploads status.json "incomplete", which fails the
    # report.
    timeout-minutes: ${{ github.event_name == 'pull_request' && 30 || 110 }}
    strategy:
      fail-fast: false
      # One job per profile (EVAL_PROFILES) per shard of the scope job's
      # selection: {profile, shard, shards, repeats, suites}.
      matrix: ${{ fromJSON(needs.scope.outputs.matrix) }}
    env:
      PROFILE: ${{ matrix.profile }}
      OUT: ${{ github.workspace }}/_eval/out
      # This shard's suites: literal paths chosen by the scope job.
      EVAL_SUITES: ${{ matrix.suites }}
      # This shard's runs per case (a big suite's repeats span shards).
      REPEATS: ${{ matrix.repeats }}
    steps:
      - name: Validate settings
        run: |
          fail() { echo "::error::$1" >&2; exit 1; }
          [[ "$EVAL_KIND" == agent || "$EVAL_KIND" == skill ]] || fail "EVAL_KIND must be agent or skill, got $EVAL_KIND"
          [[ "$EVAL_RUNNER_REF" =~ ^[0-9a-f]{40}$ ]] || fail "EVAL_RUNNER_REF must be a 40-character commit SHA, got $EVAL_RUNNER_REF"
          [[ "$EVAL_THRESHOLD" =~ ^(0(\.[0-9]+)?|1(\.0+)?)$ ]] || fail "EVAL_THRESHOLD must be between 0 and 1, got $EVAL_THRESHOLD"
          [[ "$PROFILE" =~ ^[a-z0-9][a-z0-9._-]{0,63}$ ]] || fail "invalid model profile name: $PROFILE"
          [[ "$REPEATS" =~ ^[1-9][0-9]?$ ]] || fail "repeats must be 1-99, got $REPEATS"
          mkdir -p "$OUT"
          # Until a step records the outcome, this shard is incomplete: a job
          # that times out, is cancelled or fails first uploads this (Upload
          # results runs always), and the report fails it.
          jq -n --arg p "$PROFILE" --arg k "$EVAL_KIND" \
            '{profile:$p, kind:$k, status:"incomplete", message:"the eval job ended before recording a result"}' > "$OUT/status.json"

      - uses: actions/checkout@v4
        with:
          path: _eval/repo
          persist-credentials: false

      - name: Check out the grader
        uses: actions/checkout@v4
        with:
          repository: ${{ env.EVAL_KIND == 'agent' && 'HaikeiLabs/agentware' || 'HaikeiLabs/skills' }}
          ref: ${{ env.EVAL_RUNNER_REF }}
          path: _eval/runner
          persist-credentials: false

      # Resolve the profile's base_url_env (EV-C1 §3) and ask the server for its
      # models before running anything, so a down server is reported as
      # "models unreachable", never as a score. The runner pod sets the
      # EVAL_*_BASE_URL variables to the egress Service URLs.
      - name: Probe the model server
        id: probe
        run: |
          case "$EVAL_KIND" in
            # The repository's own profiles win; agentware's are canonical.
            agent) candidates=(_eval/repo/evals/model-profiles.yaml _eval/runner/evals/model-profiles.yaml _eval/runner/python/evals/model-profiles.yaml) ;;
            skill) candidates=(_eval/runner/evals/model-profiles.yaml) ;;
          esac
          profiles_file=""
          for f in "${candidates[@]}"; do
            if [[ -f "$f" ]]; then profiles_file="$GITHUB_WORKSPACE/$f"; break; fi
          done
          echo "profiles_file=$profiles_file" >> "$GITHUB_OUTPUT"
          if [[ -z "$profiles_file" ]]; then
            echo "::error::no evals/model-profiles.yaml in ${candidates[*]}" >&2
            exit 1
          fi
          env_name=$(awk -v p="  $PROFILE:" '
            $0 == p { in_profile = 1; next }
            in_profile && /^  [^ ]/ { in_profile = 0 }
            in_profile && $1 == "base_url_env:" { print $2; exit }' "$profiles_file")
          if [[ ! "$env_name" =~ ^EVAL_[A-Z0-9_]+$ ]]; then
            echo "::error::profile $PROFILE has no EVAL_* base_url_env in $profiles_file" >&2
            exit 1
          fi
          # Run at the profile's slot count (EV-C1 §3 concurrency), so a full
          # sweep fits the job timeout. CI then uses every slot of the model
          # host, which it shares with local runs. No concurrency: one at a time.
          jobs=$(awk -v p="  $PROFILE:" '
            $0 == p { in_profile = 1; next }
            in_profile && /^  [^ ]/ { in_profile = 0 }
            in_profile && $1 == "concurrency:" { print $2; exit }' "$profiles_file")
          if [[ -z "$jobs" ]]; then
            jobs=1
            echo "::warning::profile $PROFILE has no concurrency in $profiles_file; running one eval at a time" >&2
          elif [[ ! "$jobs" =~ ^[1-9][0-9]?$ ]]; then
            echo "::error::profile $PROFILE has an invalid concurrency in $profiles_file: $jobs" >&2
            exit 1
          fi
          echo "jobs=$jobs" >> "$GITHUB_OUTPUT"
          echo "$PROFILE: $jobs concurrent evals"
          base_url=${!env_name:-}
          if [[ -z "$base_url" ]]; then
            echo "::error::$env_name is not set on this runner (HaikeiLabs/kei infra/github-actions-runner/agent-evals-runner-values.yaml)" >&2
            exit 1
          fi
          if curl --silent --show-error --fail --max-time 15 --retry 2 --retry-all-errors \
            "${base_url%/}/models" > /dev/null; then
            {
              echo "reachable=true"
              echo "base_url=${base_url%/}"
            } >> "$GITHUB_OUTPUT"
            echo "$PROFILE: $env_name answers"
          else
            echo "reachable=false" >> "$GITHUB_OUTPUT"
            jq -n --arg p "$PROFILE" --arg k "$EVAL_KIND" --arg m "$env_name did not answer" \
              '{profile:$p, kind:$k, status:"unreachable", message:$m}' > "$OUT/status.json"
            echo "::warning::$PROFILE: $env_name did not answer" >&2
          fi

      # Exit codes (EV-C1 §2): 0 all suites >= threshold, 1 below threshold,
      # 2 endpoint unavailable (never scored). The skills runner also exits 2
      # when a run did not complete for another reason, so a 2 counts as
      # "unreachable" only if the server has stopped answering since the probe.
      # status.json records the outcome for the report job.
      - name: Run agent suites
        id: agent
        if: env.EVAL_KIND == 'agent' && steps.probe.outputs.reachable == 'true'
        env:
          PROFILES_FILE: ${{ steps.probe.outputs.profiles_file }}
          BASE_URL: ${{ steps.probe.outputs.base_url }}
          JOBS: ${{ steps.probe.outputs.jobs }}
        run: |
          shopt -s globstar nullglob
          cd "$GITHUB_WORKSPACE/_eval/repo"
          # Word splitting is the point: EVAL_SUITES is a list of globs.
          # shellcheck disable=SC2206
          suites=( $EVAL_SUITES )
          if (( ${#suites[@]} == 0 )); then
            echo "::error::no suites match '$EVAL_SUITES'" >&2
            jq -n --arg p "$PROFILE" --arg k "$EVAL_KIND" '{profile:$p, kind:$k, status:"error", message:"no suites matched"}' > "$OUT/status.json"
            exit 1
          fi

          runner="$GITHUB_WORKSPACE/_eval/runner"
          uv venv --quiet "$RUNNER_TEMP/venv"
          # The evals extra carries the runner's own dependencies (PyYAML for
          # the model profiles); the base package lacks them.
          uv pip install --quiet --python "$RUNNER_TEMP/venv/bin/python" "$runner/python[evals]"

          status=ok
          message=""
          for suite in "${suites[@]}"; do
            slug=$(printf '%s' "$suite" | tr -c 'A-Za-z0-9._-' '_')
            set +e
            PYTHONPATH="$runner/python/src" "$RUNNER_TEMP/venv/bin/python" -m evals.main \
              --suite "$suite" --model-profile "$PROFILE" --profiles "$PROFILES_FILE" \
              --out "$OUT/$slug" --threshold "$EVAL_THRESHOLD" --jobs "$JOBS" --repeats "$REPEATS"
            rc=$?
            set -e
            case $rc in
              0) ;;
              # The runner exits 1 after writing benchmark.json; a 1 without it
              # is a crash (an uncaught Python exception also exits 1).
              1)
                if [[ ! -f "$OUT/$slug/benchmark.json" ]]; then
                  status=error; message="eval runner exited 1 on $suite without writing benchmark.json (a crash)"
                  echo "::error::$message; see its log above" >&2
                elif [[ "$status" == ok ]]; then
                  status=below
                fi
                ;;
              2)
                if curl --silent --fail --max-time 15 "$BASE_URL/models" > /dev/null; then
                  status=error; message="eval runner exited 2 on $suite although the model server answers"
                  echo "::error::$message" >&2
                else
                  status=unreachable; message="the model server stopped answering during $suite"; break
                fi
                ;;
              *) status=error; message="eval runner exited $rc on $suite"; echo "::error::$message" >&2 ;;
            esac
          done
          jq -n --arg p "$PROFILE" --arg k "$EVAL_KIND" --arg s "$status" --arg m "$message" \
            '{profile:$p, kind:$k, status:$s, message:$m}' > "$OUT/status.json"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # The pinned skills runner writes the opencode provider config itself
      # (OPENCODE_CONFIG_CONTENT) from the profile's base_url_env.
      - name: Run skill suites
        id: skill
        if: env.EVAL_KIND == 'skill' && steps.probe.outputs.reachable == 'true'
        env:
          BASE_URL: ${{ steps.probe.outputs.base_url }}
          JOBS: ${{ steps.probe.outputs.jobs }}
        run: |
          shopt -s globstar nullglob
          cd "$GITHUB_WORKSPACE/_eval/repo"
          # Stage the matched skills in one directory for --skills-dir.
          stage="$RUNNER_TEMP/skills"
          mkdir -p "$stage"
          count=0
          # shellcheck disable=SC2206
          for dir in $EVAL_SUITES; do
            dir=${dir%/}
            [[ -f "$dir/evals/evals.json" ]] || continue
            name=$(basename "$dir")
            [[ "$name" =~ ^[a-z0-9][a-z0-9-]{0,63}$ ]] || { echo "::error::invalid skill directory name: $name" >&2; exit 1; }
            [[ ! -e "$stage/$name" ]] || { echo "::error::two skill directories are named $name" >&2; exit 1; }
            cp -R "$dir" "$stage/$name"
            count=$((count + 1))
          done
          if (( count == 0 )); then
            echo "::error::no skill directories with evals/evals.json match '$EVAL_SUITES'" >&2
            jq -n --arg p "$PROFILE" --arg k "$EVAL_KIND" '{profile:$p, kind:$k, status:"error", message:"no suites matched"}' > "$OUT/status.json"
            exit 1
          fi

          cd "$GITHUB_WORKSPACE/_eval/runner"
          set +e
          # --no-baseline: the gate scores with_skill only, and the baseline
          # would double the load on servers shared with the team.
          node scripts/run-evals.mjs --harness opencode --skills-dir "$stage" \
            --model-profile "$PROFILE" --out "$OUT/skills" --threshold "$EVAL_THRESHOLD" \
            --jobs "$JOBS" --repeats "$REPEATS" --no-baseline
          rc=$?
          set -e
          message=""
          case $rc in
            0) status=ok ;;
            1) status=below ;;
            2)
              if curl --silent --fail --max-time 15 "$BASE_URL/models" > /dev/null; then
                status=error; message="the skills runner exited 2 (runs did not complete) although the model server answers"
                echo "::error::$message; see its log above" >&2
              else
                status=unreachable; message="the model server stopped answering during the run"
              fi
              ;;
            *) status=error; message="the skills runner exited $rc" ;;
          esac
          jq -n --arg p "$PROFILE" --arg k "$EVAL_KIND" --arg s "$status" --arg m "$message" \
            '{profile:$p, kind:$k, status:$s, message:$m}' > "$OUT/status.json"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: agent-evals-${{ env.EVAL_KIND }}-${{ matrix.profile }}-shard-${{ matrix.shard }}
          path: |
            _eval/out/**/benchmark.json
            _eval/out/**/benchmark.md
            _eval/out/status.json
          if-no-files-found: warn
          retention-days: 30

      - name: Check the outcome
        env:
          STATUS: ${{ steps.probe.outputs.reachable == 'false' && 'unreachable' || steps.agent.outputs.status || steps.skill.outputs.status }}
        run: |
          case "$STATUS" in
            ok) echo "all suites >= $EVAL_THRESHOLD on $PROFILE" ;;
            below) echo "::error::one or more suites are below $EVAL_THRESHOLD on $PROFILE; see the agent-evals comment" >&2; exit 1 ;;
            unreachable) echo "::error::models unreachable: the $PROFILE model server did not answer. Nothing was scored; this is not a pass rate. See HaikeiLabs/kei docs/agent-evals-gate.md, Troubleshooting." >&2; exit 1 ;;
            *) echo "::error::the eval runner failed on $PROFILE ($STATUS)" >&2; exit 1 ;;
          esac

  report:
    # The required status check: it runs on every pull request.
    name: agent-evals-report
    needs: [scope, eval]
    # Skipped on closed: that run only cancels the one in flight.
    if: ${{ !cancelled() && github.event.action != 'closed' }}
    outputs:
      # For the nightly job: the verdict and the report it files.
      passed: ${{ steps.report.outputs.passed }}
      body: ${{ steps.report.outputs.body }}
    # GitHub-hosted, like scope, so a fork pull request never reaches a
    # self-hosted runner either: there it evaluates nothing and passes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      # A shard killed before its upload leaves nothing to download; the
      # report must still run, so a failed download never stops it.
      - if: needs.eval.result != 'skipped'
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: agent-evals-${{ env.EVAL_KIND }}-*
          path: results

      - name: Summarize and comment
        id: report
        uses: actions/github-script@v7
        env:
          RESULTS_DIR: results
          SCOPE_RESULT: ${{ needs.scope.result }}
          SCOPE_MODE: ${{ needs.scope.outputs.mode }}
          SCOPE_SUITES: ${{ needs.scope.outputs.suites }}
          SCOPE_REASON: ${{ needs.scope.outputs.reason }}
          SCOPE_SHARDS: ${{ needs.scope.outputs.shards }}
          # A nightly sweep runs this repository's own code, like a same-repository pull request.
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          PROFILES: ${{ env.EVAL_PROFILES }}
        with:
          script: |
            // BEGIN agent-evals report (tested by HaikeiLabs/kei scripts/agent-evals/test-report.mjs)
            const fs = require('fs');
            const path = require('path');

            const kind = process.env.EVAL_KIND;
            const threshold = Number(process.env.EVAL_THRESHOLD);
            const marker = '<!-- agent-evals -->';
            const kindMarker = `<!-- agent-evals:${kind} -->`;
            const safe = (s) => String(s ?? '').replace(/[^A-Za-z0-9._-]/g, '_').slice(0, 80);
            const pct = (r) => `${(100 * r).toFixed(1)}%`;
            const safePath = (s) => String(s ?? '').replace(/[^A-Za-z0-9._\/ -]/g, '_').slice(0, 120);

            // A fork pull request: scope and eval never ran (forks get no
            // self-hosted runner) and its token cannot comment. Pass as "not
            // evaluated" so a required check is never missing.
            if (process.env.SAME_REPO !== 'true') {
              await core.summary.addRaw([
                `### Agent evals (${kind}): not evaluated`,
                '',
                'Fork pull request: evals run only on pull requests from this repository. To evaluate this change, push its branch to this repository.',
              ].join('\n')).write();
              return;
            }

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Create or update the one sticky comment for this kind, and hand the
            // report to the nightly job.
            async function upsert(body, passed) {
              core.setOutput('passed', String(passed));
              core.setOutput('body', body);
              await core.summary.addRaw(body).write();
              const issue_number = context.payload.pull_request?.number;
              if (!issue_number) return;
              const comments = await github.paginate(github.rest.issues.listComments, {
                ...context.repo, issue_number, per_page: 100,
              });
              const existing = comments.find((c) => c.user?.type === 'Bot'
                && c.body?.includes(marker) && c.body?.includes(kindMarker));
              if (existing) {
                await github.rest.issues.updateComment({ ...context.repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ ...context.repo, issue_number, body });
              }
            }
            // Unreadable JSON (a partial upload, a crashed shard) is a result, not a crash.
            const readJson = (f) => {
              try {
                return JSON.parse(fs.readFileSync(f, 'utf8'));
              } catch {
                return null;
              }
            };
            // Free text from status.json or a case reason: plain words only, as
            // a code span, so pull-request data cannot shape the comment.
            const clean = (s) => String(s ?? '').replace(/^repeat \d+(\/\d+)?: /, '').replace(/[^A-Za-z0-9 ._:\/()=-]/g, ' ')
              .replace(/\s+/g, ' ').trim().slice(0, 100);

            // Everything below posts a comment; if it throws, the catch at the
            // end still posts one, so the sticky comment never goes stale.
            try {
              const profiles = JSON.parse(process.env.PROFILES);
              const repeats = Math.max(1, Math.floor(Number(process.env.EVAL_REPEATS)) || 1);
              // The scope job's selection: changed (only these suites ran), all, or
              // none (nothing eval-relevant changed, so nothing ran and that passes).
              const scopeResult = process.env.SCOPE_RESULT;
              const scopeMode = process.env.SCOPE_MODE;
              const scopeSuites = String(process.env.SCOPE_SUITES ?? '').split(/\s+/).filter(Boolean);
              const skipped = scopeResult === 'success' && scopeMode === 'none';
              // evals:tuning: nothing ran, and the check fails until the label is removed.
              const tuning = scopeResult === 'success' && scopeMode === 'tuning';

              function walk(dir) {
                if (!fs.existsSync(dir)) return [];
                return fs.readdirSync(dir, { withFileTypes: true }).flatMap((e) =>
                  e.isDirectory() ? walk(path.join(dir, e.name)) : [path.join(dir, e.name)]);
              }

              // cells[suite][profile] = {passed, total} in runs, summed over the profile's
              // shards; shardStatus[profile][k] = ok|below|unreachable|error|missing|
              // incomplete (the job timed out, was cancelled or failed early), or any other
              // status.json value, which fails as well;
              // status[profile] = unreachable when every shard was, else ok.
              const shardCount = Math.max(1, Number(process.env.SCOPE_SHARDS) || 1);
              const shardIds = Array.from({ length: shardCount }, (_, i) => i + 1);
              const cells = {};
              const problems = [];
              const status = Object.fromEntries(profiles.map((p) => [p, 'missing']));
              const shardStatus = Object.fromEntries(profiles.map((p) => [p, Object.fromEntries(shardIds.map((k) => [k, 'missing']))]));
              const shardMessage = Object.fromEntries(profiles.map((p) => [p, {}]));
              if (scopeResult !== 'success') problems.push(`suite selection did not complete (${safe(scopeResult)}), so nothing was scored`);
              if (tuning) problems.push('evals:tuning is set: remove the label to run the gate before merge');
              const scored = scopeResult === 'success' && !skipped && !tuning;
              for (const profile of scored ? profiles : []) {
                const files = [];
                for (const k of shardIds) {
                  const dir = path.join(process.env.RESULTS_DIR, `agent-evals-${kind}-${profile}-shard-${k}`);
                  const shardFiles = walk(dir);
                  const statusFile = shardFiles.find((f) => path.basename(f) === 'status.json' && path.dirname(f) === dir);
                  if (statusFile) {
                    const doc = readJson(statusFile);
                    shardStatus[profile][k] = String(doc?.status || 'error');
                    shardMessage[profile][k] = doc ? clean(doc.message) : 'status.json is unreadable';
                  }
                  files.push(...shardFiles);
                }
                status[profile] = shardIds.every((k) => shardStatus[profile][k] === 'unreachable') ? 'unreachable' : 'ok';
                for (const f of files.filter((f) => path.basename(f) === 'benchmark.json')) {
                  // EV-C1 §5 only.
                  const doc = readJson(f);
                  if (doc?.schema !== 'haikei.eval-benchmark.v1' || !Array.isArray(doc.results)) {
                    problems.push(`\`${safe(profile)}\`: a benchmark.json is not haikei.eval-benchmark.v1`);
                    continue;
                  }
                  for (const r of doc.results) {
                    const suite = safe(r.suite);
                    const cell = ((cells[suite] ??= {})[profile] ??= { passed: 0, total: 0, errors: 0, reasons: {} });
                    cell.passed += Number(r.passed) || 0;
                    cell.total += Number(r.total) || 0;
                    cell.errors += Number(r.errors) || 0;
                    // Why runs failed or errored (missing_checks, a timeout...): a
                    // case's reason lists its runs as "repeat N: why; repeat M: why".
                    for (const c of Array.isArray(r.cases) ? r.cases : []) {
                      if (c?.passed || !c?.reason) continue;
                      for (const part of String(c.reason).split(/;\s*(?=repeat \d)/)) {
                        const why = clean(part);
                        if (why) cell.reasons[why] = (cell.reasons[why] || 0) + 1;
                      }
                    }
                  }
                }
              }

              for (const profile of scored ? profiles : []) {
                for (const k of shardIds) {
                  const st = shardStatus[profile][k];
                  const who = shardCount > 1 ? `\`${safe(profile)}\` shard ${k}/${shardCount}` : `\`${safe(profile)}\``;
                  const msg = shardMessage[profile][k];
                  if (st === 'unreachable') problems.push(`models unreachable: ${who} did not answer, so nothing was scored${msg ? ` (\`${msg}\`)` : ''}`);
                  else if (st === 'missing') problems.push(`${who}: the eval job did not produce results (missing)`);
                  else if (st === 'incomplete') problems.push(`${who}: the eval job did not finish (timed out, cancelled, or a step failed before recording a result), so its suites are not fully scored`);
                  else if (st !== 'ok' && st !== 'below') problems.push(`${who}: the eval runner failed (\`${msg || safe(st)}\`)`);
                }
              }
              const suites = Object.keys(cells).sort();
              for (const suite of suites) {
                for (const profile of profiles) {
                  const c = cells[suite][profile];
                  if (status[profile] === 'unreachable') continue;
                  if (!c || c.total === 0) problems.push(`\`${suite}\` has no scored runs on \`${safe(profile)}\``);
                  else if (c.passed / c.total < threshold) {
                    const top = Object.entries(c.reasons).sort((a, b) => b[1] - a[1]).slice(0, 2)
                      .map(([why, n]) => `\`${why}\` ×${n}`).join(', ');
                    const detail = [c.errors ? `${c.errors} of ${c.total} runs errored` : '', top].filter(Boolean).join(': ');
                    problems.push(`\`${suite}\` is below ${pct(threshold)} on \`${safe(profile)}\`${detail ? ` (${detail})` : ''}`);
                  }
                }
              }
              if (!suites.length && !problems.length && scored) problems.push('no suite results were produced');
              const scopeLine = skipped
                ? 'No eval-relevant changes: no changed file is in an eval suite, and neither this workflow nor an `EVAL_GLOBAL_PATHS` file changed. Nothing was run.'
                : scopeMode === 'changed'
                  ? `Scope: changed suites only (${scopeSuites.map((s) => `\`${safePath(s)}\``).join(', ')})`
                  : scopeMode === 'all'
                    ? `Scope: all suites (${safePath(process.env.SCOPE_REASON)})`
                    : '';

              const head = ['Suite', ...profiles.map((p) => `\`${safe(p)}\``), 'Δ vs main'];
              const rows = suites.map((suite) => [
                `\`${suite}\``,
                ...profiles.map((p) => {
                  if (status[p] === 'unreachable') return '⚠️ unreachable';
                  const c = cells[suite][p];
                  if (!c || c.total === 0) return '—';
                  const r = c.passed / c.total;
                  return `${r >= threshold ? '✅' : '❌'} ${pct(r)} (${c.passed}/${c.total} runs)`;
                }),
                // TODO(agent-evals): delta vs the last main baseline. No baseline
                // store exists yet (HaikeiLabs/kei docs/agent-evals-gate.md).
                'n/a',
              ]);
              const line = (cells) => `| ${cells.join(' | ')} |`;
              const passed = problems.length === 0;
              const sha = context.payload.pull_request?.head?.sha ?? context.sha;
              const body = [
                marker,
                kindMarker,
                `### ${passed ? '✅' : '❌'} Agent evals (${kind}): ${tuning ? 'evals:tuning is set' : skipped ? 'no eval-relevant changes' : passed ? 'passed' : 'failed'}`,
                '',
                ...(scopeLine ? [scopeLine, ''] : []),
                `Threshold ${pct(threshold)} of passed runs / total runs per suite per model · ${repeats} run(s) per case · commit \`${String(sha).slice(0, 7)}\` · [run](${runUrl})`,
                '',
                ...(suites.length ? [line(head), line(head.map(() => '---')), ...rows.map(line), ''] : []),
                ...(problems.length ? ['**Failing:**', ...problems.map((p) => `- ${p}`), ''] : []),
                '<sub>Deterministic table tests (EV-C1); no LLM grader. Δ vs main is not yet available: no baseline store.</sub>',
              ].join('\n');

              await upsert(body, passed);
              if (!passed) core.setFailed(problems.join('; '));
            } catch (err) {
              const why = clean(err?.message) || 'unknown error';
              await upsert([marker, kindMarker, `### ❌ Agent evals (${kind}): report error`, '',
                `The report could not be built (\`${why}\`), so nothing is shown as passing. See the [run](${runUrl}).`].join('\n'), false);
              core.setFailed(`agent-evals report error: ${why}`);
            }
            // END agent-evals report

  # Nightly and dispatched sweeps only: keeps one "Nightly agent evals below
  # 95%" issue open while the sweep fails, with the latest report, and closes
  # it once every suite passes. The report it files is the sticky comment's
  # text: suite names, scores and sanitized reasons, never a model URL.
  nightly:
    needs: report
    if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - name: Open, update or close the issue
        uses: actions/github-script@v7
        env:
          NIGHTLY_PASSED: ${{ needs.report.outputs.passed }}
          NIGHTLY_BODY: ${{ needs.report.outputs.body }}
        with:
          script: |
            // BEGIN agent-evals nightly (tested by HaikeiLabs/kei scripts/agent-evals/test-report.mjs)
            const title = 'Nightly agent evals below 95%';
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // No verdict (the report job crashed or was skipped) counts as failing.
            const passed = process.env.NIGHTLY_PASSED === 'true';
            const report = process.env.NIGHTLY_BODY
              || `The report produced no result. See the [run](${runUrl}).`;
            const open = (await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            })).filter((i) => i.title === title && !i.pull_request);
            const existing = open.sort((a, b) => a.number - b.number)[0];
            const body = [
              `The nightly agent-evals sweep of \`${context.ref}\` failed: at least one suite is below 95% on a model, or a model server did not answer.`,
              `This issue is updated by each failing sweep and closed by the first passing one. Latest: [run](${runUrl}), commit \`${String(context.sha).slice(0, 7)}\`.`,
              '',
              report,
            ].join('\n');
            if (!passed) {
              if (existing) {
                await github.rest.issues.update({ ...context.repo, issue_number: existing.number, body });
                core.info(`updated #${existing.number}`);
              } else {
                const { data } = await github.rest.issues.create({ ...context.repo, title, body });
                core.info(`opened #${data.number}`);
              }
            } else if (existing) {
              await github.rest.issues.createComment({ ...context.repo, issue_number: existing.number,
                body: `The nightly sweep passed: every suite is at or above 95% on every model. [Run](${runUrl}), commit \`${String(context.sha).slice(0, 7)}\`.` });
              await github.rest.issues.update({ ...context.repo, issue_number: existing.number, state: 'closed' });
              core.info(`closed #${existing.number}`);
            }
            // END agent-evals nightly
