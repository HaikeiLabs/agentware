name: Go Test

on:
  push:
    branches: [main]
    paths:
      - 'go/**'
      - 'examples/go/**'
      - '.github/workflows/go-test.yml'
      - 'testing/contracts/runtime-link/**'
      - 'fixtures/kei/**'
  pull_request:
    branches: [main]
    paths:
      - 'go/**'
      - 'examples/go/**'
      - '.github/workflows/go-test.yml'
      - 'testing/contracts/runtime-link/**'
      - 'fixtures/kei/**'

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          only-new-issues: true
          version: latest
          working-directory: ./go
      - name: Run Go module tests
        run: |
          cd go
          go mod download
          go test ./...
      - name: Run example module tests
        run: |
          cd examples/go/minimal-harness
          go mod download
          go test ./...
      - name: Run Go minimal harness offline
        run: |
          TMPDIR=$(mktemp -d "$RUNNER_TEMP/minimal-harness.XXXXXX")
          SOCKET="$TMPDIR/runtime.sock"
          AUDIT="$TMPDIR/audit.jsonl"
          python3 fixtures/kei/fake-kei-proxy-socket.py "$SOCKET" --audit "$AUDIT" &
          FAKE_PID=$!
          trap 'kill "$FAKE_PID" 2>/dev/null || true; wait "$FAKE_PID" 2>/dev/null || true; rm -rf "$TMPDIR"' EXIT
          for i in $(seq 1 20); do
            [ -S "$SOCKET" ] && break
            sleep 0.5
          done
          if [ ! -S "$SOCKET" ]; then echo "fake socket did not start"; exit 1; fi
          cd examples/go/minimal-harness
          OUTPUT=$(KEI_RUNTIME_TOKEN=fake-token go run . --socket "$SOCKET")
          printf '%s\n' "$OUTPUT"
          printf '%s\n' "$OUTPUT" | grep -Fq 'ALLOW tool=echo policy_id=fake-allow-echo result=map[echo:hello harness]'
          printf '%s\n' "$OUTPUT" | grep -Fq 'DENY tool=delete_everything reason_code=no_matching_policy hint=Add a policy for this tool: kei policies create handler=not_run'
          python3 -c 'import json, sys; rows = [json.loads(line) for line in open(sys.argv[1], encoding="utf-8") if line.strip()]; assert len(rows) == 2, rows; assert [(row["tool"], row["decision"]) for row in rows] == [("echo", "permit"), ("delete_everything", "deny")], rows' "$AUDIT"
      - name: Check kei/runtimelink ships in the module
        run: go/scripts/check-module.sh
