name: Go Test

on:
  push:
    branches: [main]
    paths:
      - 'go/**'
      - '.github/workflows/go-test.yml'
      - 'testing/contracts/runtime-link/**'
  pull_request:
    branches: [main]
    paths:
      - 'go/**'
      - '.github/workflows/go-test.yml'
      - 'testing/contracts/runtime-link/**'

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          only-new-issues: true
          version: latest
          working-directory: ./go
      - name: Run Go tests
        run: |
          cd go
          go mod download
          go test ./...
      - name: Check kei/runtimelink ships in the module
        run: go/scripts/check-module.sh
