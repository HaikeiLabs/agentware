name: Go Test

on:
  push:
    branches: [main]
    paths:
      - 'go/**'
      - 'examples/go/**'
      - '.github/workflows/go-test.yml'
      - 'testing/contracts/runtime-link/**'
      - 'fixtures/kei/**'
  pull_request:
    branches: [main]
    paths:
      - 'go/**'
      - 'examples/go/**'
      - '.github/workflows/go-test.yml'
      - 'testing/contracts/runtime-link/**'
      - 'fixtures/kei/**'

jobs:
  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          only-new-issues: true
          version: latest
          working-directory: ./go
      - name: Run Go module tests
        run: |
          cd go
          go mod download
          go test ./...
      - name: Run example module tests
        run: |
          cd examples/go/minimal-harness
          go mod download
          go test ./...
      - name: Integration test (gated)
        if: env.HARNESS_INTEGRATION_TEST == 'true'
        run: |
          TMPDIR=$(mktemp -d)
          SOCKET="$TMPDIR/runtime.sock"
          AUDIT="$TMPDIR/audit.jsonl"
          python3 fixtures/kei/fake-kei-proxy-socket.py "$SOCKET" --audit "$AUDIT" &
          FAKE_PID=$!
          for i in $(seq 1 20); do
            [ -S "$SOCKET" ] && break
            sleep 0.5
          done
          if [ ! -S "$SOCKET" ]; then echo "fake socket did not start"; kill $FAKE_PID 2>/dev/null; exit 1; fi
          cd examples/go/minimal-harness
          KEI_RUNTIME_TOKEN=fake-token go run . --socket "$SOCKET" 2>&1
          kill $FAKE_PID 2>/dev/null || true
          wait $FAKE_PID 2>/dev/null || true
          LINES=$(wc -l < "$AUDIT")
          echo "audit lines: $LINES"
          [ "$LINES" -ge 1 ] || { echo "expected at least 1 audit line"; exit 1; }
      - name: Check kei/runtimelink ships in the module
        run: go/scripts/check-module.sh
