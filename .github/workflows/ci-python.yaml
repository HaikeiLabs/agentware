name: Python CI

# Lint, the supported-version test matrix, and a build + installed-wheel check
# of haikeilabs-agentware on every change under python/. python-test.yml runs
# the coverage job on 3.11.

on:
  push:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/ci-python.yaml"
  pull_request:
    branches: [main]
    paths:
      - "python/**"
      - ".github/workflows/ci-python.yaml"

permissions:
  contents: read

jobs:
  lint-python:
    name: Lint (Python)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: ruff check src/
      - run: mypy src/

  test-python:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest

  build:
    name: Build and import the wheel
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Install the wheel outside the checkout and import it
        run: |
          python -m venv "$RUNNER_TEMP/wheel"
          "$RUNNER_TEMP/wheel/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel/bin/python" - <<'PY'
          import warnings

          import haikeilabs.agentware
          import haikeilabs.agentware.kei
          import haikeilabs.agentware.kei.runtime_socket
          import haikeilabs.agentware.kei.tool_sync

          assert "site-packages" in haikeilabs.agentware.__file__
          with warnings.catch_warnings():
              warnings.simplefilter("ignore", DeprecationWarning)
              import pedro_agentware.kei
              import pedro_agentware.kei.runtime_socket
          assert pedro_agentware.kei is haikeilabs.agentware.kei
          assert pedro_agentware.kei.runtime_socket is haikeilabs.agentware.kei.runtime_socket
          print("haikeilabs-agentware", haikeilabs.agentware.__version__)
          PY
