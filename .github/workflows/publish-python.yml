# Publish haikeilabs-agentware (import haikeilabs.agentware) to PyPI with trusted publishing.
#
# Follows the Python Packaging User Guide, "Publishing package distribution
# releases using GitHub Actions CI/CD workflows": build once in an
# unprivileged job, pass dist/ to the publish job as an artifact, and publish
# with OIDC (no stored token) from a protected environment, with attestations.
#
# PyPI trusted publisher (and the TestPyPI one, for pre-releases):
#   project haikeilabs-agentware, owner HaikeiLabs, repository agentware,
#   workflow publish-python.yml, environment release.
name: Publish Python package

on:
  push:
    tags:
      - "agentware-py-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match python/pyproject.toml)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-agentware-publish
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Python release
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release tag on workflow_dispatch
    outputs:
      release_ref: ${{ steps.release.outputs.release_ref }}
      version: ${{ steps.release.outputs.version }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - id: release
        name: Verify version and create release tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            expected_version="$INPUT_VERSION"
          else
            expected_version="${REF_NAME#agentware-py-v}"
          fi

          # Semantic version in its PEP 440 spelling: 1.2.3, 1.2.3rc1, 1.2.3.post1, 1.2.3.dev1.
          if ! [[ "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?(\.post[0-9]+)?(\.dev[0-9]+)?$ ]]; then
            echo "Invalid version: $expected_version" >&2
            exit 1
          fi

          project_version() {
            python -c 'import tomllib; print(tomllib.load(open("python/pyproject.toml", "rb"))["project"]["version"])'
          }

          actual_version="$(project_version)"
          if [ "$actual_version" != "$expected_version" ]; then
            echo "python/pyproject.toml is $actual_version, release is $expected_version" >&2
            exit 1
          fi

          release_tag="agentware-py-v$expected_version"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$release_tag"; then
              echo "Release tag already exists: $release_tag — verifying tag commit" >&2
              git fetch origin "refs/tags/$release_tag:refs/tags/$release_tag"
              git checkout "$release_tag"
            else
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git config user.name "github-actions[bot]"
              git tag -a "$release_tag" -m "Agentware Python $expected_version" "$RELEASE_SHA"
              git push origin "$release_tag"
            fi
          fi

          actual_version="$(project_version)"
          test "$actual_version" = "$expected_version"

          if [[ "$expected_version" =~ (a|b|rc|\.dev)[0-9]+$ ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          {
            echo "release_ref=refs/tags/$release_tag"
            echo "version=$expected_version"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build distributions
    needs: prepare
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: python -m pip install --upgrade build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Check distributions
        run: python -m twine check --strict dist/*

      - name: Inspect the artifacts
        run: |
          # The wheel holds the haikeilabs namespace and the deprecated
          # pedro_agentware alias, nothing else (no "evals", no tests).
          python -m zipfile -l dist/*.whl | awk 'NR > 1 {split($1, p, "/"); print p[1]}' | sort -u | grep -v '\.dist-info$' > top_level.txt
          printf 'haikeilabs\npedro_agentware\n' | diff - top_level.txt
          # haikeilabs/ is a PEP 420 namespace package: it must not ship an __init__.py.
          if python -m zipfile -l dist/*.whl | grep -q '^haikeilabs/__init__\.py'; then
            echo "haikeilabs/__init__.py must not be packaged" >&2
            exit 1
          fi
          rm top_level.txt
          python -m zipfile -l dist/*.whl | grep -q 'haikeilabs/agentware/py.typed'
          python -m zipfile -l dist/*.whl | grep -q '\.dist-info/licenses/LICENSE'
          # The sdist is a buildable source snapshot with its tests.
          tar tzf dist/*.tar.gz | grep -q '/tests/'
          tar tzf dist/*.tar.gz | grep -q '/LICENSE$'

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: python-package-distributions
          path: python/dist/
          if-no-files-found: error

  smoke:
    name: Smoke-test the wheel (Python ${{ matrix.python-version }})
    needs: [prepare, build]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the wheel outside any checkout and import it
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/smoke"
          "$RUNNER_TEMP/smoke/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/smoke/bin/python" - <<'PY'
          import importlib
          import os

          import haikeilabs.agentware

          assert haikeilabs.agentware.__version__ == os.environ["VERSION"], haikeilabs.agentware.__version__
          assert "site-packages" in haikeilabs.agentware.__file__, haikeilabs.agentware.__file__
          for name in haikeilabs.agentware.__all__:
              getattr(haikeilabs.agentware, name)
          for module in (
              "haikeilabs.agentware.middleware",
              "haikeilabs.agentware.middleware.guardrails",
              "haikeilabs.agentware.kei",
              "haikeilabs.agentware.kei.runtime_socket",
              "haikeilabs.agentware.kei.tool_sync",
              "haikeilabs.agentware.tools",
              "haikeilabs.agentware.toolformat",
              "haikeilabs.agentware.executor",
              "haikeilabs.agentware.llm",
              "haikeilabs.agentware.llmcontext",
          ):
              importlib.import_module(module)

          from haikeilabs.agentware.middleware import (
              Action, CallerContext, Decision, PolicyEvaluator,
          )

          class SmokePolicyEvaluator(PolicyEvaluator):
              def evaluate(self, tool_name, args, caller):
                  action = Action.DENY if tool_name == "github.delete_repo" else Action.ALLOW
                  return Decision(action=action, rule="smoke", reason="smoke decision")

          evaluator = SmokePolicyEvaluator()
          caller = CallerContext(user_id="smoke", invoking_subject="smoke")
          assert evaluator.evaluate("github.delete_repo", {}, caller).action is Action.DENY
          assert evaluator.evaluate("github.get_issue", {}, caller).action is Action.ALLOW

          # The deprecated alias warns and resolves to the same objects.
          import warnings

          with warnings.catch_warnings(record=True) as caught:
              warnings.simplefilter("always")
              import pedro_agentware.kei.evaluator as old_evaluator
              import pedro_agentware.kei.runtime_socket as old_socket
          assert any(issubclass(w.category, DeprecationWarning) for w in caught)
          import haikeilabs.agentware.kei.evaluator as new_evaluator
          import haikeilabs.agentware.kei.runtime_socket as new_socket

          assert old_evaluator is new_evaluator
          assert old_socket is new_socket
          print("haikeilabs-agentware", haikeilabs.agentware.__version__, "OK")
          PY

  publish-pypi:
    name: Publish to PyPI
    needs: [prepare, build, smoke]
    if: needs.prepare.outputs.prerelease == 'false'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/p/haikeilabs-agentware
    permissions:
      id-token: write # trusted publishing; no stored token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          attestations: true

  publish-testpypi:
    name: Publish pre-release to TestPyPI
    needs: [prepare, build, smoke]
    if: needs.prepare.outputs.prerelease == 'true'
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://test.pypi.org/p/haikeilabs-agentware
    permissions:
      id-token: write # trusted publishing; no stored token
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: python-package-distributions
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
