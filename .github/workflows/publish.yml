# Release agentware at one shared version: npm, PyPI and the Go module.
#
# VERSION at the repository root is the version source; every file that
# carries it literally is checked by scripts/release/version.py. One release
# tag, agentware-v<VERSION>, drives the whole release:
#   1. prepare  - the tag (or dispatch input) must equal VERSION and every
#                 synced file must agree, or nothing is published.
#   2. stage    - build, test and publish @haikeilabs/agentware to npm.
#   3. go-tag   - push go/v<VERSION> on the release commit, so
#                 go get github.com/haikeilabs/agentware/go@v<VERSION> resolves.
#   4. pypi     - dispatch publish-python.yml at the release tag. PyPI's trusted
#                 publisher is bound to that workflow, so it keeps doing the
#                 build, smoke test, agentware-py-v<PEP 440> tag and publish.
# The file keeps its name because npm trusted publishing is bound to it.
name: Release Agentware (npm, PyPI, Go)

on:
  push:
    tags:
      - "agentware-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (must match VERSION)"
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: npm-agentware-stage
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Agentware release
    runs-on: ubuntu-latest
    outputs:
      release_ref: ${{ steps.release.outputs.release_ref }}
      version: ${{ steps.tags.outputs.version }}
      pep440: ${{ steps.tags.outputs.pep440 }}
      go_tag: ${{ steps.tags.outputs.go_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - id: release
        name: Verify version and create release tag
        working-directory: typescript
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            expected_version="$INPUT_VERSION"
          else
            expected_version="${REF_NAME#agentware-v}"
          fi

          if ! [[ "$expected_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semantic version: $expected_version" >&2
            exit 1
          fi

          actual_version="$(npm pkg get version | tr -d '\"')"
          test "$actual_version" = "$expected_version"

          release_tag="agentware-v$expected_version"

          # Every registry's version must equal VERSION before anything is tagged.
          python3 ../scripts/release/version.py check --tag "$release_tag"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if git ls-remote --exit-code --tags origin "refs/tags/$release_tag"; then
              echo "Release tag already exists: $release_tag — verifying tag commit" >&2
              git fetch origin "refs/tags/$release_tag"
              git checkout "$release_tag"
            else
              git config user.email "github-actions[bot]@users.noreply.github.com"
              git config user.name "github-actions[bot]"
              git tag -a "$release_tag" -m "Agentware $expected_version" "$RELEASE_SHA"
              git push origin "$release_tag"
            fi
          fi

          actual_version="$(npm pkg get version | tr -d '\"')"
          test "$actual_version" = "$expected_version"

          python3 ../scripts/release/version.py check --tag "$release_tag"

          echo "release_ref=refs/tags/$release_tag" >> "$GITHUB_OUTPUT"

      - id: tags
        name: Derive the registry tags
        run: python3 scripts/release/version.py tags --format github-output >> "$GITHUB_OUTPUT"

  stage:
    needs: prepare
    name: Stage @haikeilabs/agentware
    runs-on: ubuntu-latest
    environment: release
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Drop NODE_AUTH_TOKEN for OIDC-only publish
        run: sed -i '/_authToken/d' "${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"

      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - name: Install minimal harness example dependency
        working-directory: examples/typescript/minimal-harness
        run: npm ci
      - run: npm test -- --runInBand
      - run: npm run check:package
      - run: env -u NODE_AUTH_TOKEN npm publish --provenance

  go-tag:
    needs: [prepare, stage]
    name: Tag the Go module
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.release_ref }}
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version-file: go/go.mod

      - name: Check the module builds for an external consumer
        working-directory: go
        run: |
          go vet ./...
          go test ./internal/modulecheck/

      - name: Push the Go tag on the release commit
        env:
          GO_TAG: ${{ needs.prepare.outputs.go_tag }}
        run: |
          release_sha="$(git rev-parse "HEAD^{commit}")"
          if git ls-remote --exit-code --tags origin "refs/tags/$GO_TAG"; then
            git fetch origin "refs/tags/$GO_TAG:refs/tags/$GO_TAG"
            tagged_sha="$(git rev-parse "$GO_TAG^{commit}")"
            if [ "$tagged_sha" != "$release_sha" ]; then
              echo "$GO_TAG already points at $tagged_sha, not $release_sha" >&2
              exit 1
            fi
            echo "$GO_TAG already on the release commit"
          else
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git config user.name "github-actions[bot]"
            git tag -a "$GO_TAG" -m "Agentware Go ${GO_TAG#go/}" "$release_sha"
            git push origin "$GO_TAG"
          fi

      - name: Ask the Go module proxy for the new version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          for attempt in 1 2 3 4 5; do
            if GOPROXY=https://proxy.golang.org GOFLAGS=-mod=mod go list -m "github.com/haikeilabs/agentware/go@v$VERSION"; then
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "proxy.golang.org has not served v$VERSION yet; it will on first request" >&2

  pypi:
    needs: [prepare, stage]
    name: Dispatch the PyPI release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Run publish-python.yml at the release tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ needs.prepare.outputs.release_ref }}
          PEP440: ${{ needs.prepare.outputs.pep440 }}
        run: |
          gh workflow run publish-python.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${RELEASE_REF#refs/tags/}" \
            -f version="$PEP440"
