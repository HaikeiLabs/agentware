name: Rust Test

on:
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-test.yml'
      - 'fixtures/**'
      - 'testing/contracts/runtime-socket/**'
      - 'testing/contracts/runtime-link/**'
  pull_request:
    branches: [main]
    paths:
      - 'rust/**'
      - '.github/workflows/rust-test.yml'
      - 'fixtures/**'
      - 'testing/contracts/runtime-socket/**'
      - 'testing/contracts/runtime-link/**'

jobs:
  rust-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10-16
        with:
          toolchain: 1.85.0
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - name: Run Clippy
        run: cargo clippy --manifest-path rust/Cargo.toml --workspace --all-targets -- -D warnings
      - name: Run tests
        run: cargo test --manifest-path rust/Cargo.toml --workspace
