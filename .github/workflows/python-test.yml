name: Python Test

on:
  push:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python-test.yml'
      - 'testing/contracts/runtime-link/**'
      - 'fixtures/kei/**'
      - 'examples/python/minimal-harness/**'
      - 'README.md'
  pull_request:
    branches: [main]
    paths:
      - 'python/**'
      - '.github/workflows/python-test.yml'
      - 'testing/contracts/runtime-link/**'
      - 'fixtures/kei/**'
      - 'examples/python/minimal-harness/**'
      - 'README.md'

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          cd python
          pip install -e ".[dev]"
      - name: Run Python lint
        run: |
          cd python
          ruff check src/
          mypy src/
      - name: Run Python tests
        run: |
          cd python
          pytest tests/ --cov=src/haikeilabs/agentware --cov-report=xml
      - name: Run Python minimal harness offline
        run: |
          audit_file="$RUNNER_TEMP/minimal-harness-audit.jsonl"
          output="$(python examples/python/minimal-harness/main.py --fake --audit "$audit_file")"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | grep -Fq 'ALLOW tool=echo policy_id=fake-allow-echo'
          printf '%s\n' "$output" | grep -Fq 'DENY tool=delete_everything reason_code=no_matching_policy hint=Add a policy for this tool: kei policies create'
          python -c 'import json, sys; rows = [json.loads(line) for line in open(sys.argv[1], encoding="utf-8") if line.strip()]; assert len(rows) == 2, rows; assert [(row["tool"], row["decision"]) for row in rows] == [("echo", "permit"), ("delete_everything", "deny")], rows' "$audit_file"
